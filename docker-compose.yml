# 산돌이 인증 스택(Keycloak + auth-relay). 단독으로 기동하는 기본 구성.
# 같은 서버에서 루트(tuk_sandol_team) 프로젝트와 함께 띄울 때만
# docker-compose.colocated.yml을 겹쳐 쓴다. 자세한 내용은 README.md와 docs/migration.md 참고.
name: sandol-auth

x-logging: &logging
  driver: "local"
  options:
    max-size: "10m"
    max-file: "7"

services:
  keycloak-db:
    container_name: keycloak-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d keycloak -U ${KC_DB_USERNAME}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 20s
    restart: always
    logging: *logging

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start"]
    # 메인 서버 gateway가 닿는 포트. 기본 루프백이라 colocated에선 외부 노출 없음. 9000(관리)은 열지 않는다.
    ports:
      - "${AUTH_BIND_ADDR:-127.0.0.1}:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # 공개 주소(경로 포함). issuer가 이 값으로 정해진다.
      KC_HOSTNAME: ${KC_PUBLIC_URL:-https://sandori.kr/auth}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      # 앞단 프록시(gateway)가 붙는 네트워크 대역. colocated에서는 루트의 keycloak_edge 서브넷과 같아야 한다.
      KC_PROXY_TRUSTED_ADDRESSES: ${KEYCLOAK_EDGE_SUBNET:-172.31.255.248/29}
      KC_HOSTNAME_STRICT: "true"
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # 앱의 Apple identity token → Keycloak 토큰 교환(external → internal)은 legacy token exchange(v1)만 지원
      KC_FEATURES: token-exchange,admin-fine-grained-authz:v1
      KC_LOG_CATEGORY__ORG_FREEMARKER__LEVEL: DEBUG
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -n 1 <&3 | grep -q 'HTTP/1.1 200'"
        ]
      interval: 1m30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./sandol_user_service/web/keycloak-theme:/opt/keycloak/themes:ro
      # Apple 로그인 확장 jar. Keycloak 버전을 올릴 때 jar 호환 버전도 확인
      - type: bind
        source: ./sandol_user_service/keycloak/providers/apple-identity-provider-1.17.0-sandol.1.jar
        target: /opt/keycloak/providers/apple-identity-provider-1.17.0-sandol.1.jar
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db-backup:
        condition: service_completed_successfully
      keycloak-db:
        condition: service_healthy
    logging: *logging

  postgres-exporter-keycloak:
    container_name: postgres-exporter-keycloak
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://sandol_exporter:${PG_EXPORTER_PASSWORD}@keycloak-db:5432/keycloak?sslmode=disable"
    # 메인 서버 prometheus가 스크레이프하는 포트. 기본 루프백.
    ports:
      - "${AUTH_BIND_ADDR:-127.0.0.1}:9187:9187"
    depends_on:
      - keycloak-db
    restart: always
    logging: *logging

  auth-relay:
    container_name: auth-relay
    build: ./sandol-auth-relay
    image: sandol-auth-relay:${TAG:-latest}
    env_file:
      - ./sandol-auth-relay/.env
    # 메인 서버 kakao-bot이 서버 간으로 호출하는 포트(/relay/issue_login_link 포함). 기본 루프백.
    ports:
      - "${AUTH_BIND_ADDR:-127.0.0.1}:8000:8000"
    volumes:
      - ${SANDOL_DATA_DIR:-/home/ubuntu/data/sandol}/auth-relay/clients.json:/app/app/config/clients.json:ro
    restart: on-failure
    logging: *logging
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/relay/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Keycloak 기동 전 DB 스냅샷. one-shot으로 매 up마다 재실행되며, 실패하면
  # keycloak이 기동되지 않는다(fail-closed). 이미지는 keycloak-db와 같은 것을 재사용한다.
  db-backup:
    container_name: sandol-auth-db-backup
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["sh", "/db-backup.sh"]
    environment:
      BACKUP_KEEP: ${BACKUP_KEEP:-10}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - ./scripts/db-backup.sh:/db-backup.sh:ro
      - ${SANDOL_AUTH_BACKUP_DIR:-${SANDOL_DATA_DIR:-/home/ubuntu/data/sandol}/backups-auth}:/backup
    depends_on:
      keycloak-db:
        condition: service_healthy
    logging: *logging

# 볼륨 이름을 고정해 기존 루트 프로젝트의 볼륨에 그대로 붙는다.
# 기본값의 접두사(sandol_team)는 루트의 COMPOSE_PROJECT_NAME이다. 서버의 `docker volume ls`로 확인하고 .env에서 맞춘다.
# 이 파일만으로 빈 서버에서 기동하면 빈 볼륨이 새로 만들어진다(새 Keycloak).
# 기존 데이터를 옮기는 서버에서는 colocated 오버라이드가 external로 바꿔, 볼륨이 없으면 에러로 멈춘다.
volumes:
  keycloak_db_data:
    name: ${KEYCLOAK_DB_VOLUME:-sandol_team_keycloak_db_data}
  keycloak_data:
    name: ${KEYCLOAK_DATA_VOLUME:-sandol_team_keycloak_data}
