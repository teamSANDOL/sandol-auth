# 경고: 운영 Keycloak DB 볼륨(keycloak_db_data)을 직접 마운트해 realm import를 수행한다.
# 실행 전에 운영 keycloak·keycloak-db를 먼저 멈춘다(동시 사용·컨테이너 이름 충돌 방지).
# 사용: docker compose -f docker-compose.auth-restore.yml up  (종료 후 down, -v 금지)
name: sandol-auth-restore

services:
  keycloak-db:
    container_name: keycloak-db-restore
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d keycloak -U ${KC_DB_USERNAME}"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 20s

  keycloak:
    container_name: keycloak-restore
    image: quay.io/keycloak/keycloak:26.8.1
    command:
      [
        "import",
        "--dir",
        "/tmp/keycloak-import",
        "--override",
        "true"
      ]
    environment:
      KC_FEATURES: token-exchange:v1,admin-fine-grained-authz:v1
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - type: bind
        source: ./sandol_user_service/keycloak/providers/apple-identity-provider-1.17.0-sandol.1.jar
        target: /opt/keycloak/providers/apple-identity-provider-1.17.0-sandol.1.jar
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

volumes:
  keycloak_db_data:
    name: ${KEYCLOAK_DB_VOLUME:-sandol_team_keycloak_db_data}